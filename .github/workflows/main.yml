name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Builder repo
      - name: Checkout builder repo
        uses: actions/checkout@v4

      # 2. React repo klonla
      - name: Clone React project
        run: |
          git clone https://github.com/agnogad/openlibtr-web.git app

      # 3. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      # 4. Install + Build
      - name: Install dependencies & build
        run: |
          cd app
          npm install
          npm run build

      # 5. Capacitor environment
      - name: Setup Capacitor project
        run: |
          mkdir mobile
          cd mobile

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init openlibtr com.openlibtr.app --web-dir=www

      # 6. Build output kopyala (dist FIX)
      - name: Copy build output
        run: |
          mkdir -p mobile/www

          if [ -d "app/dist" ]; then
            cp -r app/dist/* mobile/www/
          elif [ -d "app/build" ]; then
            cp -r app/build/* mobile/www/
          else
            echo "❌ Build output not found!"
            exit 1
          fi

      # 7. Android ekle
      - name: Add Android
        run: |
          cd mobile
          npx cap add android

      # 8. Sync
      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync

      # 9. Java (Gradle için)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 10. Android SDK cache (speedup)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 11. APK build
      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 12. APK upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openlibtr-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
