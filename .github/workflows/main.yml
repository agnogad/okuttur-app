name: Build Signed APK, AAB & GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Clone React repo
      - name: Clone React project
        run: git clone https://github.com/agnogad/openlibtr-web.git app

      # 3. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Build React (Vite → dist)
      - name: Install & Build React
        run: |
          cd app
          npm install
          npm run build

      # 5. Capacitor setup
      - name: Setup Capacitor
        run: |
          mkdir mobile
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init okuttur com.okuttur.app --web-dir=www

      # 6. Copy dist
      - name: Copy build output
        run: |
          mkdir -p mobile/www
          cp -r app/dist/* mobile/www/

      # 7. Android add
      - name: Add Android
        run: |
          cd mobile
          npx cap add android

      # 8. Sync
      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync

      # 9. App name
      - name: Set App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Okuttur<\/string>/' \
            mobile/android/app/src/main/res/values/strings.xml

      - name: Set StatusBar color (Android)
        run: |
          sed -i '/<resources>/a \
            <color name="status_bar_color">#0f172a</color>' \
            mobile/android/app/src/main/res/values/colors.xml

          sed -i 's/<\/style>/    <item name="android:statusBarColor">@color\/status_bar_color<\/item>\n<\/style>/' \
            mobile/android/app/src/main/res/values/styles.xml

      # 10. Assets (icon)
      - name: Prepare assets
        run: |
          mkdir -p mobile/assets
          cp assets/icon.png mobile/assets/icon.png

      # 11. Generate icons
      - name: Generate App Icons
        run: |
          cd mobile
          npm install @capacitor/assets
          npx capacitor-assets generate

      # 12. Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 13. Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      # 14. ✅ Signing config — mevcut android bloğuna PATCH et (duplicate yok)
      - name: Inject Signing Config
        run: |
          GRADLE=mobile/android/app/build.gradle

          # signingConfigs bloğunu buildTypes'tan önce ekle
          sed -i '/buildTypes {/i \
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("MYAPP_RELEASE_STORE_PASSWORD")\
                      keyAlias System.getenv("MYAPP_RELEASE_KEY_ALIAS")\
                      keyPassword System.getenv("MYAPP_RELEASE_KEY_PASSWORD")\
                  }\
              }' "$GRADLE"

          # release buildType içine signingConfig satırını ekle
          sed -i '/buildTypes {/{n;/release {/{n;s/$/\n                    signingConfig signingConfigs.release/}}}'  "$GRADLE" || true

          # Alternatif: release bloğunu bul ve signingConfig ekle
          python3 - <<'PYEOF'
          import re

          path = "mobile/android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          # release buildType bloğuna signingConfig ekle (yoksa)
          if "signingConfig signingConfigs.release" not in content:
              content = re.sub(
                  r'(buildTypes\s*\{[^}]*release\s*\{)',
                  r'\1\n                signingConfig signingConfigs.release',
                  content,
                  flags=re.DOTALL
              )

          with open(path, "w") as f:
              f.write(content)

          print("build.gradle patched successfully")
          PYEOF

          echo "=== Final build.gradle ==="
          cat "$GRADLE"

      # 15. Gradle cache
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      # 16. Build RELEASE (Signed APK + AAB)
      - name: Build Release
        env:
          MYAPP_RELEASE_STORE_FILE: app/release.keystore
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      # 17. APK imzalanmış mı doğrula
      - name: Verify APK signature
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify --verbose "$APK" || true

      # 18. Debug outputs
      - name: Debug outputs
        run: |
          ls -R mobile/android/app/build/outputs/

      # 19. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

      # 20. GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Okuttur v${{ github.run_number }}
          files: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
