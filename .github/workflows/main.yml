name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Builder repo checkout
      - name: Checkout builder repo
        uses: actions/checkout@v4

      # 2. React repo klonla
      - name: Clone React project
        run: |
          git clone https://github.com/agnogad/openlibtr-web.git app

      # 3. Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Install deps + build
      - name: Install & Build React
        run: |
          cd app
          npm install
          npm run build

      # 5. Capacitor kur
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli

      # 6. Capacitor init
      - name: Init Capacitor
        run: |
          mkdir mobile
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init openlibtr com.openlibtr.app

      # 7. Build output kopyala
      - name: Copy build files
        run: |
          mkdir -p mobile/www
          cp -r app/build/* mobile/www/

      # 8. Android ekle
      - name: Add Android platform
        run: |
          cd mobile
          npx cap add android

      # 9. Sync
      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync

      # 10. Java setup
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 11. Gradle build (APK)
      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 12. APK upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openlibtr-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
