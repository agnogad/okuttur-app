name: Build Signed APK, AAB & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Clone React repo
      - name: Clone React project
        run: git clone https://github.com/agnogad/openlibtr-web.git app

      # 3. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Build React (Vite)
      - name: Install & Build
        run: |
          cd app
          npm install
          npm run build

      # 5. Capacitor setup
      - name: Setup Capacitor
        run: |
          mkdir mobile
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init okuttur com.okuttur.app --web-dir=www

      # 6. Copy dist
      - name: Copy build output
        run: |
          mkdir -p mobile/www
          cp -r app/dist/* mobile/www/

      # 7. Add Android
      - name: Add Android
        run: |
          cd mobile
          npx cap add android

      # 8. Sync
      - name: Sync
        run: |
          cd mobile
          npx cap sync

      # 9. App Name
      - name: Set App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Okuttur<\/string>/' mobile/android/app/src/main/res/values/strings.xml

      # 10. ICON prepare
      - name: Prepare assets
        run: |
          mkdir -p mobile/assets
          cp assets/icon.png mobile/assets/icon.png

      # 11. ICON generate
      - name: Generate App Icons
        run: |
          cd mobile
          npm install @capacitor/assets
          npx capacitor-assets generate

      # 12. Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 13. Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      # 14. Gradle cache
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}

      # 15. Build RELEASE (SIGNED)
      - name: Build Release APK & AAB
        run: |
          cd mobile/android
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PMYAPP_RELEASE_STORE_FILE=app/release.keystore \
            -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

          ./gradlew bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=app/release.keystore \
            -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      # 16. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab

      # 17. GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Okuttur v${{ github.run_number }}
          files: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
