name: Build Signed APK, AAB & GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Clone React repo
      - name: Clone React project
        run: git clone https://github.com/agnogad/openlibtr-web.git app

      # 3. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Build React
      - name: Install & Build React
        run: |
          cd app
          npm install
          npm run build

      # 5. Capacitor setup
      - name: Setup Capacitor
        run: |
          mkdir mobile
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init okuttur com.okuttur.app --web-dir=www

      # 6. Copy dist
      - name: Copy build output
        run: |
          mkdir -p mobile/www
          cp -r app/dist/* mobile/www/

      # 7. Add Android
      - name: Add Android
        run: |
          cd mobile
          npx cap add android

      # 8. Sync
      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync

      # 9. App name
      - name: Set App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Okuttur<\/string>/' \
            mobile/android/app/src/main/res/values/strings.xml

      # 🔥 10. STATUS BAR FIX (YAML SAFE)
      - name: Fix Status Bar Color
        run: |
          VALUES_DIR=mobile/android/app/src/main/res/values
          COLORS=$VALUES_DIR/colors.xml
          STYLES=$VALUES_DIR/styles.xml

          mkdir -p $VALUES_DIR

          # colors.xml oluştur (her zaman overwrite)
          cat <<EOF > $COLORS
          <resources>
          <color name="status_bar_color">#1c1b1f</color>
          </resources>
          EOF

          # styles.xml içine ekle (yoksa)
          if ! grep -q "statusBarColor" $STYLES; then
            sed -i '/<\/style>/i\    <item name="android:statusBarColor">@color/status_bar_color</item>' $STYLES
          fi

      # 11. Assets
      - name: Prepare assets
        run: |
          mkdir -p mobile/assets
          cp assets/icon.png mobile/assets/icon.png

      # 12. Generate icons
      - name: Generate App Icons
        run: |
          cd mobile
          npm install @capacitor/assets
          npx capacitor-assets generate

      # 13. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 14. Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      # 15. Signing config
      - name: Inject Signing Config
        run: |
          GRADLE=mobile/android/app/build.gradle

          sed -i '/buildTypes {/i \
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("MYAPP_RELEASE_STORE_PASSWORD")\
                      keyAlias System.getenv("MYAPP_RELEASE_KEY_ALIAS")\
                      keyPassword System.getenv("MYAPP_RELEASE_KEY_PASSWORD")\
                  }\
              }' "$GRADLE"

          python3 - <<'PYEOF'
          import re
          path = "mobile/android/app/build.gradle"
          with open(path) as f:
              c = f.read()
          if "signingConfig signingConfigs.release" not in c:
              c = re.sub(r'(release\s*\{)', r'\1\n                signingConfig signingConfigs.release', c)
          open(path,"w").write(c)
          PYEOF

      # 16. Build
      - name: Build Release
        env:
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      # 17. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

      # 18. GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Okuttur v${{ github.run_number }}
          files: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
